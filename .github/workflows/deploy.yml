# NOTE Astro 를 빌드해 GitHub Pages 로 올린다
# - 저장소 설정 Pages -> Source 가 "GitHub Actions" 여야 동작한다
# - 이미지가 많아 체크아웃과 업로드가 느리다. 타임아웃을 넉넉히 둔다
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOTE 연달아 병합하면 중간 커밋까지 전부 배포된다. 그 사이 라이브가 미완성 상태를 보여준다
# - 그래서 빌드는 최신 것만 남기고 앞의 것을 취소한다. 아직 Pages 에 올리기 전이라 안전하다
# - 배포(deploy job)는 취소하지 않는다. 중간에 끊으면 Pages 가 반쯤 올라간 상태로 남는다
concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 한글 파일명이 깨지지 않도록 로케일을 고정한다 [로케일 고정]
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 빌드 전에 막는다. 배포한 뒤 깨진 것을 발견하면 늦다
      - run: npm run lint
      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 실제 배포는 한 번에 하나만, 시작한 것은 끝까지 보낸다
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
