# NOTE Astro 를 빌드해 GitHub Pages 로 올린다 (MIGRATION.md Phase 5)
# - Pages 설정에서 소스를 "Deploy from a branch" -> "GitHub Actions" 로 바꿔야 동작한다
# - 이미지가 586MB 라 체크아웃과 업로드가 느리다. 타임아웃을 넉넉히 둔다
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 중에 새 푸시가 오면 앞의 것을 취소한다. 순서가 뒤집히면 안 된다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 빌드 전에 막는다. 배포한 뒤 깨진 것을 발견하면 늦다
      - run: npx astro check

      - run: npx astro build
        env:
          # 한글 파일명이 깨지지 않도록 로케일을 고정한다 (2-7)
          LC_ALL: en_US.UTF-8

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
